[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngesh"
version = "2.0.0a3"
description = "Auditable continuous-time phylogenetic benchmark simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tiago Tresoldi"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
ngesh = "ngesh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
